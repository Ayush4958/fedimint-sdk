name: Verify
on:
  workflow_call:
    inputs:
      run_core:
        description: 'Run core build and typecheck jobs'
        required: false
        type: boolean
        default: true
      run_web:
        description: 'Run web/WASM integration tests'
        required: false
        type: boolean
        default: true
      run_docs:
        description: 'Run docs build'
        required: false
        type: boolean
        default: true
      run_cli:
        description: 'Run create-fedimint-app CLI tests'
        required: false
        type: boolean
        default: true
  workflow_dispatch:

jobs:
  lint:
    name: Lint
    permissions:
      contents: write
    runs-on: ubuntu-latest

    steps:
      - name: Clone repository
        uses: actions/checkout@v4

      - name: Install dependencies
        uses: ./.github/actions/install-deps

      - name: Lint repo
        run: pnpm lint:repo

      - name: Lint code
        run: pnpm lint

  build:
    name: Build JS
    if: ${{ inputs.run_core != false }}
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Clone repository
        uses: actions/checkout@v4

      - name: Install dependencies
        uses: ./.github/actions/install-deps

      - name: Build
        run: pnpm build

  types:
    name: Check Types
    if: ${{ inputs.run_core != false }}
    runs-on: ubuntu-latest

    steps:
      - name: Clone repository
        uses: actions/checkout@v4

      - name: Install dependencies
        uses: ./.github/actions/install-deps

      - name: Build types package
        run: pnpm --filter @fedimint/types build

      - name: Check types
        run: pnpm typecheck

  test:
    name: Test
    if: ${{ inputs.run_web != false }}
    runs-on: [self-hosted, linux, x64]
    timeout-minutes: 30

    steps:
      - name: Clone repository
        uses: actions/checkout@v4

      - name: Setup Nix
        uses: ./.github/actions/setup-nix
        with:
          cachix_auth_token: ${{ secrets.CACHIX_AUTH_TOKEN }}

      - name: Build WASM
        uses: ./.github/actions/build-wasm

      - name: Run pnpm tests
        shell: bash
        run: |
          nix develop --accept-flake-config .#wasm-tests --command bash <<'EOF'
            set -euo pipefail

            # Install dependencies
            pnpm install

            # Build packages
            pnpm build

            # Run Tests
            pnpm test
          EOF

      - name: Report Size
        uses: alexlwn123/compressed-size-action@alex/fix-build
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}
          pattern: '{packages/**/dist/**/*.{js,mjs,cjs},packages/**/*.wasm}'
          install-script: nix develop --accept-flake-config -c pnpm install
          build-script: nix develop --accept-flake-config -c pnpm build

  build-docs:
    name: Build Docs
    if: ${{ inputs.run_docs != false }}
    runs-on: ubuntu-latest

    steps:
      - name: Clone repository
        uses: actions/checkout@v4

      - name: Install dependencies
        uses: ./.github/actions/install-deps

      - name: Build Packages (dependency of docs)
        run: pnpm build

      - name: Build Docs
        run: pnpm docs:build

  test-cli:
    name: Test CLI
    if: ${{ inputs.run_cli != false }}
    runs-on: ubuntu-latest

    steps:
      - name: Clone repository
        uses: actions/checkout@v4

      - name: Install dependencies
        uses: ./.github/actions/install-deps

      - name: Build create-fedimint-app
        run: pnpm --filter create-fedimint-app build

      - name: Run CLI tests
        run: pnpm test:create